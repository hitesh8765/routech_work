[pytest]
markers =
    ui: tests that drive the real browser UI
    api: tests that hit the API layer only
    parcel: parcel booking tests
    pallet: pallet booking tests
    luggage: luggage booking tests
    documents: documents booking tests
    smoke: quick smoke-test subset
    probe: opt-in partner/route diagnostic (creates unpaid bookings; run with -m probe)
addopts = -ra --strict-markers -m "not probe"
